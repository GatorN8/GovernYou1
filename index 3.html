{id:'house-nov11',level:'Federal',area:'House',type:'meeting',date:'2026-11-11',label:'House · Nov 11',title:'House next meeting scheduled for 11 a.m. Eastern',status:'Published schedule · upcoming',category:'Upcoming session',summary:'The House Clerk’s November 10 floor summary listed the next House meeting for November 11 at 11:00 a.m. Eastern.',why:'A scheduled House meeting is not itself a commitment to vote on a particular bill.',next:'Check the House floor activity record for subsequent proceedings and updated plans.',people:'U.S. House of Representatives.',url:'https://clerk.house.gov/static/',source:'Office of the Clerk, November 10 floor activity summary'}
];
let records = [...snapshotRecords];
const sources = [
{title:'Congress.gov legislative data',kind:'Federal · bills and actions',desc:'Official bill database. API key needed for automated bulk collection.',url:'https://api.congress.gov/'},
{title:'U.S. House recorded votes',kind:'Federal · votes',desc:'Original vote questions, tallies and member-level results.',url:'https://clerk.house.gov/Votes'},
{title:'U.S. Senate recorded votes',kind:'Federal · votes',desc:'Original roll calls and per-senator participation records.',url:'https://www.senate.gov/legislative/LIS/roll_call_lists/vote_menu_119_2.htm'},
{title:'Indiana General Assembly',kind:'State · legislation',desc:'Bills, amendments, legislative activity and related records.',url:'https://iga.in.gov/legislative'},
{title:'New Haven City Council',kind:'Local · New Haven',desc:'Meeting agendas, minutes, city government information and streams.',url:'https://www.newhaven.in.gov/555/City-Council'},
{title:'Fort Wayne Council documents',kind:'Local · Fort Wayne',desc:'Original ordinances, resolutions, agendas and meeting materials.',url:'https://citycouncildocuments.acfw.net/meetings/view/818'},
{title:'Allen County Agenda Center',kind:'Local · Allen County',desc:'County government meeting agendas, packets and minutes.',url:'https://www.allencounty.in.gov/AgendaCenter'},
{title:'Indiana Gateway financial data',kind:'Public Money · finance data',desc:'Local government annual financial reports and budget data. Figures not imported into this build.',url:'https://gateway.ifionline.org/public/download.aspx'},
{title:'Indiana Gateway reporting caveats',kind:'Public Money · accounting quality',desc:'Explains submitted, adopted and audited reporting distinctions.',url:'https://gateway.ifionline.org/public/dataQuality.aspx'}
];
const views=[['today','Today','⌂'],['congress','Congress','▤'],['local','State & Local','▦'],['money','Public Money','$'],['explore','Explore','⌕'],['saved','Saved','☆']];
const state={view:(location.hash.replace('#','')||'today'),query:'',filter:'All',localArea:'All',saved:new Set(),canStore:true,feedStatus:'snapshot',feedLastSuccess:null,feedSources:{}};
const CONTENT=document.getElementById('content'), OVERLAY=document.getElementById('detailOverlay'), DRAWER=document.getElementById('drawer');
let lastFocus=null,toastTimer=null;
try{state.saved=new Set(JSON.parse(localStorage.getItem('cc:saved:v1')||'[]'))}catch(e){state.canStore=false}
function esc(x){return String(x??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function fmtDate(s){return new Date(s+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}
function fmtMoney(n){return Number(n).toLocaleString('en-US',{style:'currency',currency:'USD',minimumFractionDigits:n%1?2:0,maximumFractionDigits:2})}
function getStatusClass(r){return r.type==='money'||r.status.includes('Introduced')?'proposal':r.type==='law'?'enacted':r.type==='meeting'?'meeting':''}
function navMarkup(nav,mobile=false){return views.map(([id,label,glyph])=>`<button class="${mobile?'':'navbtn '}${state.view===id?'active':''}" data-view="${id}" ${state.view===id?'aria-current="page"':''}><span class="navglyph" aria-hidden="true">${glyph}</span><span>${esc(label)}</span></button>`).join('')}
function renderNav(){document.getElementById('side-nav').innerHTML=navMarkup(false);document.getElementById('mobile-nav').innerHTML=navMarkup(true)}
function header(eyebrow,title,desc){return `<div class="page-head"><div><div class="eyebrow">${esc(eyebrow)}</div><h1>${esc(title)}</h1><p class="page-desc">${esc(desc)}</p></div><span class="datechip">◷ ${esc(state.feedLastSuccess?'Federal check · '+fmtDate(state.feedLastSuccess.slice(0,10)):'Baseline · Nov 11, 2026')}</span></div>`}
function infoBanner(){
  const success=Object.entries(state.feedSources).filter(([k,v])=>v.state==='ok').map(([k])=>k);
  const issues=Object.entries(state.feedSources).filter(([k,v])=>v.state==='unavailable'||v.state==='needs_api_key').map(([k])=>k);
  let message='The included research snapshot was last checked November 11, 2026. Automatic federal updates are not activated. Follow original links to check newer actions.';
  let heading='Research snapshot — not live';
  if(state.feedStatus==='synced'||state.feedStatus==='partial'){
    heading=state.feedStatus==='synced'?'Official records imported':'Partial official-record update';
    message=`Federal source imports last completed ${new Date(state.feedLastSuccess).toLocaleString('en-US',{dateStyle:'medium',timeStyle:'short'})}. Updated: ${success.join(', ')||'none'}. ${issues.length?'Unavailable or pending: '+issues.join(', ')+'.':''} Historical local entries remain the original November 11 snapshot. An import is not instantaneous reporting.`;
  }
  return `<div class="note-bar" role="note"><span aria-hidden="true">ⓘ</span><div><strong>${esc(heading)}.</strong> ${esc(message)} <button class="textaction" data-refresh="1" type="button">Check for published updates ↻</button></div></div>`;
}

function card(r){const saved=state.saved.has(r.id);return `<article class="activity"><div class="meta"><span class="pill ${getStatusClass(r)}">${esc(r.label)}</span><span>${esc(fmtDate(r.date))}</span></div><h3>${esc(r.title)}</h3>${r.amount!==undefined?`<div class="money">${fmtMoney(r.amount)} <span style="font-size:10px;color:#956a2e;font-weight:700;letter-spacing:0">PROPOSED</span></div>`:''}<p>${esc(r.summary)}</p>${r.yes!==undefined?`<div class="breakdown"><span class="count yea">${r.yes} Yea</span><span>·</span><span class="count nay">${r.no} Nay</span><span>·</span><span>${r.nv} not voting</span></div>`:''}<div class="actions"><div class="actionleft"><button class="tiny-button" data-open="${r.id}" aria-label="Details about ${esc(r.title)}">Why it matters +</button><a class="small-link" target="_blank" rel="noopener noreferrer" href="${esc(r.url)}">Official source ↗</a></div><button class="save ${saved?'saved':''}" data-save="${r.id}" aria-label="${saved?'Remove saved record':'Save record'}: ${esc(r.title)}" aria-pressed="${saved}">${saved?'★ Saved':'☆ Save'}</button></div></article>`}
function recordsCards(items){return items.length?`<div class="cards">${items.map(card).join('')}</div>`:empty('No matching records','Try clearing a filter, or check an official source for additional records. This preview covers selected records only.')}
function empty(title,body){return `<div class="empty"><h3>${esc(title)}</h3><p>${esc(body)}</p></div>`}
function subsection(title,action,query){return `<div class="section-head"><h2>${esc(title)}</h2>${action?`<button class="link-button" data-view="${action}">${esc(query||'View all')} →</button>`:''}</div>`}
function showToday(){const federal=records.filter(r=>r.level==='Federal'&&r.type!=='meeting').sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4);const local=records.filter(r=>['bridge','firestation'].includes(r.id));const today=new Date().toLocaleDateString('en-CA',{timeZone:'America/Indiana/Indianapolis'});const upcoming=records.filter(r=>r.type==='meeting'&&r.date>=today).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,4);return header('Daily civic intelligence','Know what your government is doing.','The important actions, the actual records, and what comes next — without the political noise.')+infoBanner()+`<div class="grid2"><div><section class="summary-panel"><div class="eyebrow">Government records · Research brief</div><h2>Look beyond the headline.<br>Find the actual decision.</h2><p>Our records distinguish legislative proposals, procedural votes, chamber actions and local contracts. Each has a different legal and financial meaning.</p><button class="hero-button" data-view="explore">Explore verified records →</button></section>${subsection('Congressional activity','congress','All federal records')}<div class="stack">${federal.map(card).join('')}</div></div><div>${subsection('What happens next','local','State & local')}<div class="panel">${upcoming.length?upcoming.map(r=>`<div class="timeline-item"><span class="timeline-dot"></span><div><strong>${esc(r.title)}</strong><p>${esc(fmtDate(r.date))} · ${esc(r.status)}</p><button class="textaction" data-open="${r.id}" style="font-size:11px">Details & source</button></div></div>`).join(''):'<p class="block-muted">No upcoming events are verified in the imported records. Check official calendars for current schedules.</p>'}</div>${subsection('Local proposals worth tracking','money','Follow the money')}<div class="stack">${local.map(card).join('')}</div></div></div>`}
function filterButtons(items){return `<div class="filters">${items.map(([v,label])=>`<button class="filter ${state.filter===v?'active':''}" data-filter="${esc(v)}" aria-pressed="${state.filter===v}">${esc(label)}</button>`).join('')}</div>`}
function showCongress(){let items=records.filter(r=>r.level==='Federal'&&(state.filter==='All'||r.area===state.filter));return header('Federal government','Congress','Verified House and Senate roll calls, procedural explanations and published next steps.')+infoBanner()+filterButtons([['All','All'],['House','House'],['Senate','Senate']])+recordsCards(items)+`<div class="section-head"><h2>Learn the distinction</h2></div><div class="grid2"><div class="panel"><h3>Procedural vote ≠ bill passed</h3><p class="block-muted">A motion to proceed or rules resolution can change what Congress considers without passing the underlying measure. Always check the recorded question, not just a “Passed” label.</p></div><div class="panel"><h3>Not voting ≠ confirmed absence</h3><p class="block-muted">Official not-voting totals do not establish why an individual did not cast a vote. The app deliberately avoids assigning attendance motives.</p></div></div>`}
function showLocal(){const a=state.localArea;let items=records.filter(r=>['Local','State'].includes(r.level)&&(a==='All'||(a==='Indiana'?r.level==='State':r.area===a)));return header('Your communities','State & Local','Keep Indiana, New Haven, Fort Wayne and Allen County distinct while following their public records.')+infoBanner()+`<div class="filters">${['All','Indiana','New Haven','Fort Wayne','Allen County'].map(area=>`<button class="filter ${a===area?'active':''}" data-area="${esc(area)}" aria-pressed="${a===area}">${esc(area)}</button>`).join('')}</div>`+(a==='New Haven'?empty('New Haven: official documents available','No New Haven meeting outcome has been independently verified for this preview. The source portal below provides official current agendas; nothing has been invented to fill the feed.'):recordsCards(items))+`<div class="section-head"><h2>Official local records</h2></div>`+renderResources(sources.filter(s=>/New Haven|Fort Wayne|Allen County|Indiana General Assembly/.test(s.title)))}
function showMoney(){const items=records.filter(r=>r.type==='money'||r.id==='budget-amend');return header('Public financial accountability','Follow the public money.','Track real proposals and source documents without confusing contracts, budgets, authorizations or spending.')+infoBanner()+`<div class="metricrow"><div class="metric"><strong>Proposed</strong><span>Listed contract figures are proposals in documents, not verified payments</span></div><div class="metric"><strong>Not confirmed</strong><span>Final approval votes and executed contracts for these examples</span></div><div class="metric"><strong>Not imported</strong><span>Annual financial-report totals from Indiana Gateway</span></div></div><div class="note-bar"><span>⚠</span><div><strong>Financial interpretation:</strong> These are individual proposed contract amounts. Do not add them together as total budget spending or compare them to expenditure totals. Funding sources, amendments and actual payments require further records.</div></div>${subsection('Proposed contracts and appropriations','',null)}${recordsCards(items)}${subsection('Finance records you can investigate','',null)}${renderResources(sources.filter(s=>/Gateway/.test(s.title)))}`}
function renderResources(items){return `<div class="resource-list">${items.map(s=>`<div class="resource"><div><strong>${esc(s.title)}</strong><span>${esc(s.kind)} · ${esc(s.desc)}</span></div><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">Open official source ↗</a></div>`).join('')}</div>`}
function showExplore(){const q=state.query.trim().toLowerCase();let items=records.filter(r=>[r.title,r.summary,r.area,r.label,r.category,r.status,r.people].some(s=>String(s||'').toLowerCase().includes(q)));if(state.filter!=='All')items=items.filter(r=>r.level===state.filter);return header('Research desk','Explore records','Search this verified snapshot by topic, bill, vote, government body or project. Broader database search is planned.')+infoBanner()+filterButtons([['All','All levels'],['Federal','Federal'],['State','State'],['Local','Local']])+`<p class="subnote" style="margin:0 0 14px">Showing ${items.length} of ${records.length} sourced records${q?' for “'+esc(state.query)+'”':''}. Search is limited to this preview’s included records.</p>`+recordsCards(items)+subsection('Primary-source directory','',null)+renderResources(sources)}
function showSaved(){const items=records.filter(r=>state.saved.has(r.id));return header('Your research','Saved records','Bookmark items you want to revisit. Saved state is stored on this device and browser, not synchronized to an account.')+(state.canStore?'':`<div class="note-bar">Browser storage is unavailable. Saves will only last until this page is closed.</div>`)+(items.length?recordsCards(items):empty('Nothing saved yet','Use ☆ Save on a record to bookmark it in this browser.'))+(items.length?'':`<p class="subnote" style="margin-top:12px">Use ☆ Save on any record in Today, Congress, State & Local, Public Money or Explore.</p>`)}
function render(){if(!views.some(v=>v[0]===state.view))state.view='today';renderNav();const map={today:showToday,congress:showCongress,local:showLocal,money:showMoney,explore:showExplore,saved:showSaved};CONTENT.innerHTML=map[state.view]()+`<div class="footer">Congress Compass · v0.2 · Official-source importer ready · Timestamps are source-check times, not evidence of a new vote · No third-party analytics</div>`}
function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2100)}
function go(view){if(!views.some(v=>v[0]===view))return;state.view=view;state.filter='All';location.hash=view;render();window.scrollTo({top:0,behavior:'instant'});CONTENT.focus({preventScroll:true})}
function save(id){if(!records.some(r=>r.id===id))return;const was=state.saved.has(id);was?state.saved.delete(id):state.saved.add(id);try{localStorage.setItem('cc:saved:v1',JSON.stringify([...state.saved]))}catch(e){state.canStore=false}render();toast(was?'Removed from saved':'Saved to this browser'+(state.canStore?'':' (temporary only)'))}
function openRecord(id){const r=records.find(r=>r.id===id);if(!r)return;if(!OVERLAY.classList.contains('open'))lastFocus=document.activeElement;const srcLink=`<a class="source-anchor" href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">Open ${esc(r.source)} ↗</a>`;DRAWER.innerHTML=`<div class="drawer-top"><span class="eyebrow">${esc(r.level)} · ${esc(r.category)}</span><button class="close" data-close aria-label="Close details">×</button></div><div class="drawer-tags"><span class="pill ${getStatusClass(r)}">${esc(r.status)}</span></div><h2 id="drawerTitle">${esc(r.title)}</h2><div class="drawer-meta"><span>${esc(fmtDate(r.date))}</span><span>•</span><span>${esc(r.label)}</span></div>${r.amount!==undefined?`<div class="drawer-amount">${fmtMoney(r.amount)}</div><div class="dollar-note"><strong>Proposed contract amount.</strong> Approval, final budget, funding, contract execution and expenditure are not confirmed by this snapshot.</div>`:''}${r.yes!==undefined?`<div class="breakdown"><b class="count yea">${r.yes} Yea</b> · <b class="count nay">${r.no} Nay</b> · ${r.nv} Not voting</div>`:''}<div class="section"><h3>What happened?</h3><p>${esc(r.summary)}</p></div><div class="section"><h3>Why it matters</h3><p>${esc(r.why)}</p></div><div class="section"><h3>Who is involved?</h3><p>${esc(r.people)}</p></div>${r.voteDetail?`<div class="section"><h3>Documented voting detail</h3><p>${esc(r.voteDetail)}</p></div>`:''}<div class="section"><h3>What happens next?</h3><p>${esc(r.next)}</p></div>${r.note?`<div class="dollar-note">${esc(r.note)}</div>`:''}<div class="section"><h3>Evidence</h3><p>${esc(r.source)}. ${esc(r.verifiedAt?'Imported from official record '+new Date(r.verifiedAt).toLocaleString('en-US',{dateStyle:'medium',timeStyle:'short'}):'Research checked Nov 11, 2026. New developments require verification.')}</p>${srcLink}${r.extraUrl?`<p><a class="small-link" target="_blank" rel="noopener noreferrer" href="${esc(r.extraUrl)}">${esc(r.extraSource||'Additional primary record')} ↗</a></p>`:''}${r.related?`<p><a class="small-link" target="_blank" rel="noopener noreferrer" href="${esc(r.related)}">View council meeting documents ↗</a></p>`:''}</div><button class="tiny-button" data-save="${r.id}" style="margin-top:12px">${state.saved.has(r.id)?'★ Remove from saved':'☆ Save this record'}</button>`;OVERLAY.classList.add('open');document.body.style.overflow='hidden';DRAWER.focus()}
function closeDetail(){OVERLAY.classList.remove('open');document.body.style.overflow='';if(lastFocus && document.contains(lastFocus))lastFocus.focus();else CONTENT.focus({preventScroll:true})}
document.addEventListener('click',e=>{const target=e.target.closest('button');if(!target)return;if(target.dataset.view){closeDetail();go(target.dataset.view)}else if(target.dataset.open)openRecord(target.dataset.open);else if(target.dataset.refresh){loadFederalFeed(true)}else if(target.dataset.save){const id=target.dataset.save;const modalOpen=OVERLAY.classList.contains('open');save(id);if(modalOpen)openRecord(id)}else if(target.dataset.filter){state.filter=target.dataset.filter;render()}else if(target.dataset.area){state.localArea=target.dataset.area;render()}else if(target.hasAttribute('data-close'))closeDetail()});
OVERLAY.addEventListener('click',e=>{if(e.target===OVERLAY)closeDetail()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&OVERLAY.classList.contains('open'))closeDetail();if(e.key==='Tab'&&OVERLAY.classList.contains('open')){const focusables=[...DRAWER.querySelectorAll('button,a[href]')];if(!focusables.length)return;const first=focusables[0],last=focusables[focusables.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
document.getElementById('searchInput').addEventListener('input',e=>{state.query=e.target.value;state.view='explore';state.filter='All';if(location.hash!=='#explore')history.replaceState(null,'','#explore');render()});
window.addEventListener('hashchange',()=>{state.view=location.hash.replace('#','')||'today';state.filter='All';render()});

async function loadFederalFeed(manual=false){
  try{
    const response=await fetch('./data/federal.json',{cache:'no-store'});
    if(!response.ok)throw new Error('feed unavailable');
    const feed=await response.json();
    if(feed.schemaVersion!==1||!Array.isArray(feed.records))throw new Error('Unexpected feed format');
    const live=feed.records.filter(r=>r&&r.level==='Federal'&&typeof r.id==='string'&&typeof r.url==='string'&&r.url.startsWith('https://')&&typeof r.title==='string'&&typeof r.date==='string'&&/^\d{4}-\d\d-\d\d$/.test(r.date)&&typeof r.source==='string'&&typeof r.summary==='string');
    const ids=new Set(live.map(r=>r.id));
    if(live.length!==ids.size)throw new Error('Duplicate record IDs');
    const superseded=new Set();
    for(const r of live){
      if(r.id==='fed:senate:119:2:258')superseded.add('senate258');
      if(r.id==='fed:house:2026:319')superseded.add('house319');
      if(r.id==='fed:house:2026:316')superseded.add('house316');
    }
    records=[...live,...snapshotRecords.filter(r=>!superseded.has(r.id))];
    state.feedSources=feed.sources||{};
    const successes=Object.values(state.feedSources).filter(x=>x&&x.state==='ok'&&x.lastSuccess);
    state.feedLastSuccess=successes.length?successes.map(x=>x.lastSuccess).sort().at(-1):null;
    state.feedStatus=successes.length?(successes.length===3?'synced':'partial'):'snapshot';
    if(state.feedLastSuccess){
      document.getElementById('sideStamp').textContent='Federal check: '+fmtDate(state.feedLastSuccess.slice(0,10));
      document.getElementById('sideSync').textContent=state.feedStatus==='synced'?'All 3 sources imported':'Partial source coverage';
    }
    render();
    if(manual)toast(state.feedLastSuccess?'Published records checked. Import timestamp: '+state.feedLastSuccess.slice(0,10):'No active imported records yet');
  }catch(e){
    if(manual)toast('No published feed available; showing last built-in snapshot');
    if(!state.feedLastSuccess){state.feedStatus='snapshot';render()}
  }
}

render();
loadFederalFeed();
</script>
